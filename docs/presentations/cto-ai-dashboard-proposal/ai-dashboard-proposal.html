<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Optibide — Bảng Quản Trị Đấu Thầu Dành Cho Chủ Khách Sạn</title>
  <style>
    :root {
      --bg: #F3F5F9;
      --card: #FFFFFF;
      --ink: #0F172A;
      --sub: #334155;
      --muted: #64748B;
      --line: #CBD5E1;
      --line-soft: #E2E8F0;
      --blue: #1D4ED8;
      --green: #047857;
      --amber: #B45309;
      --red: #B91C1C;
      --purple: #6D28D9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    html[lang="ko"] body { word-break: keep-all; }
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: 240px; background: #FFFFFF; border-right: 1px solid var(--line-soft);
      padding: 22px 16px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; border-bottom: 1px solid var(--line-soft); margin-bottom: 10px; }
    .brand-logo {
      width: 38px; height: 38px; border-radius: 10px; background: var(--blue); color: #FFF;
      font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-name { font-weight: 800; font-size: 16px; color: var(--ink); line-height: 1.2; }
    .brand-sub { font-size: 12px; color: var(--muted); font-weight: 600; }
    .nav-item {
      padding: 11px 14px; border-radius: 8px; font-size: 14.5px; font-weight: 600; color: #475569;
      display: flex; align-items: center; gap: 10px; cursor: pointer;
    }
    .nav-item.active { background: #EFF6FF; color: var(--blue); font-weight: 700; }
    .main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      min-height: 66px; background: #FFFFFF; border-bottom: 1px solid var(--line-soft);
      padding: 10px 28px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    }
    .topbar-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    select, .btn-lineage {
      height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
      background: #FFFFFF; color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    select:hover, .btn-lineage:hover { border-color: #94A3B8; }
    .btn-lineage.active { background: #0F172A; color: #FFFFFF; border-color: #0F172A; }
    .content { max-width: 1460px; width: 100%; margin: 0 auto; padding: 22px 26px 44px; display: flex; flex-direction: column; gap: 20px; }
    .data-cutoff-note { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }

    /* KPI Cards — Clear, Large Numbers for 50–60yo Executives */
    .kpi-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
    .kpi-card { background: var(--card); border: 1px solid var(--line-soft); border-radius: 12px; padding: 18px 20px; }
    .kpi-label { font-size: 13.5px; font-weight: 700; color: #475569; margin-bottom: 6px; }
    .kpi-val { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .kpi-sub { font-size: 13px; color: var(--muted); margin-top: 5px; font-weight: 500; }

    .grid-2 { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; }
    .grid-2-eq { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .chart-card {
      background: var(--card); border: 1px solid var(--line-soft); border-radius: 14px;
      padding: 22px 26px; display: flex; flex-direction: column; gap: 16px;
    }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .card-title { font-size: 18px; font-weight: 800; color: var(--ink); }
    .card-purpose { font-size: 14px; color: #475569; margin-top: 4px; }
    .card-purpose strong { color: var(--ink); font-weight: 700; }
    .badge-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge-kpi {
      font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 8px; white-space: nowrap; border: 1px solid transparent;
    }
    .lineage-chip {
      display: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px; font-weight: 700; color: #1E40AF; background: #EFF6FF;
      border: 1px solid #BFDBFE; padding: 4px 9px; border-radius: 6px; margin-top: 6px; width: fit-content;
    }
    body.show-lineage .lineage-chip { display: inline-block; }

    /* Context Paired Bars */
    .hbar-list { display: flex; flex-direction: column; gap: 15px; padding: 4px 0; }
    .hbar-item { display: flex; flex-direction: column; gap: 6px; }
    .hbar-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 700; }
    .hbar-pair { display: flex; flex-direction: column; gap: 6px; }
    .hbar-row { display: grid; grid-template-columns: 164px 1fr 62px; align-items: center; gap: 10px; font-size: 13.5px; color: #475569; font-weight: 600; }
    .hbar-track { height: 13px; background: #F1F5F9; border-radius: 6px; overflow: hidden; }
    .hbar-fill { height: 100%; border-radius: 6px; transition: width 0.25s ease; }

    /* TRUE Interactive 4-Stage Funnel Layout + Dual Loss-Rate Summary Table */
    .funnel-layout { display: grid; grid-template-columns: 0.88fr 1.16fr; gap: 20px; align-items: center; }
    .funnel-stage-poly { cursor: pointer; transition: opacity 0.18s ease, filter 0.18s ease; }
    .funnel-stage-poly:hover, .funnel-stage-poly.is-active { filter: brightness(0.95) drop-shadow(0 4px 10px rgba(15,23,42,0.18)); }
    .excel-table { width: 100%; border-collapse: collapse; font-size: 13.5px; border: 1px solid var(--line); }
    .excel-table th {
      background: #F1F5F9; color: var(--ink); font-weight: 700; text-align: left;
      padding: 8px 10px; border: 1px solid var(--line-soft); font-size: 12.8px; line-height: 1.3;
    }
    .excel-table td { padding: 9px 10px; border: 1px solid var(--line-soft); vertical-align: middle; line-height: 1.35; }
    .excel-table tr.f-row { cursor: pointer; transition: background 0.15s ease; }
    .excel-table tr.f-row:hover, .excel-table tr.f-row.is-active { background: #EFF6FF !important; }
    .funnel-detail-bar {
      background: #F8FAFC; border: 1.5px solid var(--line);
      border-radius: 10px; padding: 13px 18px; display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 14.5px; flex-wrap: wrap;
    }

    /* Ranked Cause Bars */
    .pareto-col { display: flex; flex-direction: column; gap: 15px; }
    .pareto-sub { font-size: 15.5px; font-weight: 800; color: var(--ink); padding-bottom: 8px; border-bottom: 1.5px solid var(--line-soft); }
    .p-row { display: flex; flex-direction: column; gap: 7px; }
    .p-head { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; font-weight: 700; }

    /* Calm Executive Recommendation Cards (Monochrome Slate & Navy — Zero Rainbow) */
    .ai-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .ai-card {
      border: 1px solid var(--line); border-radius: 12px;
      padding: 22px 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px;
    }
    .ai-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .ai-tier {
      font-size: 12.5px; font-weight: 700; padding: 5px 11px; border-radius: 6px;
      background: #F1F5F9; color: #334155; border: 1px solid #E2E8F0;
    }
    .ai-score { font-size: 24px; font-weight: 800; color: #0F172A; }
    .ai-bar-track { height: 6px; border-radius: 99px; background: #E2E8F0; overflow: hidden; }
    .ai-bar-fill { height: 100%; border-radius: 99px; background: #1E40AF; }
    .ai-action { font-size: 16.5px; font-weight: 800; color: #0F172A; line-height: 1.38; margin-top: 2px; }
    .ai-note { font-size: 14.5px; color: #475569; line-height: 1.5; }

    /* Floating Interactive Tooltip */
    #chart-tooltip {
      position: fixed; pointer-events: none; z-index: 9999; display: none;
      background: #0F172A; color: #FFFFFF; padding: 12px 15px; border-radius: 10px;
      font-size: 13.5px; line-height: 1.45; max-width: 360px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.28); border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div id="chart-tooltip"></div>
  <div class="app-shell" id="app-shell" data-capture="full-hub">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">O</div>
        <div>
          <div class="brand-name">Optibide</div>
          <div class="brand-sub" id="brand-sub">Quản trị Đấu thầu Khách sạn</div>
        </div>
      </div>
      <div class="nav-item active" id="nav-overview">Tổng quan kinh doanh</div>
      <div class="nav-item" id="nav-calendar">Lịch khách nhận phòng</div>
      <div class="nav-item" id="nav-payout">Doanh thu &amp; Công nợ</div>
      <div class="nav-item" id="nav-rooms">Danh mục hạng phòng</div>
      <div class="nav-item" id="nav-bidding">Cài đặt báo giá tự động</div>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-controls">
          <select id="property-select" data-testid="topbar-property-select" aria-label="Chọn khách sạn">
            <option value="a" id="prop-opt-a">Khách sạn mẫu A — Đang kinh doanh ổn định (91 lượt báo giá)</option>
            <option value="b" id="prop-opt-b">Khách sạn mẫu B — Mới khai trương (75 lượt báo giá · Chưa có đơn)</option>
          </select>
          <select id="period-select" data-testid="period-select" aria-label="Chọn kỳ báo cáo">
            <option value="30d" id="period-opt-30d">Kỳ báo cáo: 30 ngày qua</option>
            <option value="7d" id="period-opt-7d">Kỳ báo cáo: 7 ngày qua</option>
          </select>
          <span class="data-cutoff-note" id="data-cutoff-note"></span>
        </div>
        <div class="topbar-controls">
          <select id="language-select" data-testid="topbar-language-select" aria-label="Language">
            <option value="vi">Tiếng Việt</option>
            <option value="en">English</option>
            <option value="ko">한국어</option>
          </select>
          <select id="currency-select" data-testid="topbar-currency-select" aria-label="Đơn vị tiền tệ">
            <option value="VND" id="cur-opt-vnd">Đơn vị: VNĐ (₫)</option>
            <option value="KRW" id="cur-opt-krw">Đơn vị: Won Hàn Quốc (₩)</option>
            <option value="USD" id="cur-opt-usd">Đơn vị: Đô la Mỹ ($)</option>
          </select>
          <button class="btn-lineage" id="cto-lineage-toggle" type="button">Xem nguồn sự kiện thu thập</button>
        </div>
      </header>
      <main class="content">
        <section class="kpi-strip" id="kpi-strip"></section>
        <section class="chart-card" id="chart-revenue-card" data-capture="chart-revenue"></section>
        <div class="grid-2" id="winning-price-section" data-capture="winning-price-section">
          <section class="chart-card" id="chart-sweetspot-card" data-capture="chart-sweetspot"></section>
          <section class="chart-card" id="chart-context-card" data-capture="chart-context"></section>
        </div>
        <section class="chart-card" id="loss-diagnosis-section" data-capture="chart-waterfall"></section>
        <section class="chart-card" id="chart-pareto-card" data-capture="chart-pareto"></section>
        <section class="chart-card" id="ai-advisor-section" data-capture="ai-advisor-section"></section>
      </main>
    </div>
  </div>

            score: 94.7, src: 'booking_form_complete · offer_card_impression',
            tier: { vi: 'Mức trên 70% · Điểm mạnh duy trì', en: 'Above 70% · Keep Strength', ko: '70% 이상 · 강점 유지 항목' },
            action: { vi: 'Duy trì báo giá tự động và chào kèm 2 – 3 hạng phòng', en: 'Maintain 100% Auto-bid and quote 2–3 room categories', ko: '자동 입찰 100% 유지 및 2~3개 객실 타입 동시 제안' },
            note: {
              vi: 'Tốc độ phản hồi dưới 1 phút đang rất tốt; giới thiệu thêm lựa chọn hạng phòng giúp nâng thứ hạng xuất hiện trên danh sách.',
              en: 'Sub-1-minute response coverage is strong; quoting 2–3 room options lifts ranking on the guest offer list.',
              ko: '1분 이내 자동 응답 강점을 유지하면서 다중 객실을 함께 제안하면 목록 노출 순위가 높아집니다.',
            },
          },
        ],
      },
    };

    let activeFunnelIdx = 1;
    const tip = document.getElementById('chart-tooltip');

    function showTip(e, html) {
      tip.innerHTML = html;
      tip.style.display = 'block';
      tip.style.left = Math.min(window.innerWidth - 380, e.clientX + 16) + 'px';
      tip.style.top = Math.max(12, e.clientY - 24) + 'px';
    }
    function hideTip() { tip.style.display = 'none'; }

    function fmtDec(num, digits, locale) {
      const s = Number(num).toFixed(digits);
      return locale === 'vi' ? s.replace('.', ',') : s;
    }

    function fmtChartDate(isoDate, locale) {
      const [ , mStr, dStr ] = isoDate.split('-');
      const mIdx = Number(mStr) - 1;
      if (locale === 'vi') return `${dStr}/${mStr}`;
      if (locale === 'ko') return `${Number(mStr)}월 ${Number(dStr)}일`;
      return `${EN_MONTHS[mIdx]} ${dStr}`;
    }

    function fmtFullDateOffset(daysAgo, locale) {
      const dt = new Date(Date.now() - daysAgo * 86400000);
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, '0');
      const d = String(dt.getDate()).padStart(2, '0');
      if (locale === 'vi') return `${d}/${m}/${y}`;
      if (locale === 'ko') return `${y}.${m}.${d}`;
      return `${EN_MONTHS[dt.getMonth()]} ${d}, ${y}`;
    }

    function fmtMoney(vnd, cur, mult, locale) {
      const v = vnd * mult;
      if (v === 0) return cur === 'KRW' ? '0 ₩' : cur === 'USD' ? '$0' : '0 ₫';
      if (cur === 'USD') {
        const usd = Math.round(v / 25400);
        return `$${usd.toLocaleString('en-US')}`;
      }
      if (cur === 'KRW') {
        const krw = v / 18.5;
        if (locale === 'ko') {
          const man = krw / 10000;
          return man >= 100
            ? `${Math.round(man).toLocaleString('ko-KR')}만 ₩`
            : `${man.toFixed(1).replace(/\.0$/, '')}만 ₩`;
        }
        if (locale === 'en') {
          return krw >= 1000000
            ? `${(krw / 1000000).toFixed(2).replace(/\.?0+$/, '')}M ₩`
            : `${Math.round(krw / 1000).toLocaleString('en-US')}K ₩`;
        }
        return `${(krw / 1000).toFixed(0)} Nghìn ₩`;
      }
      const tr = v / 1000000;
      if (locale === 'vi') return `${tr.toFixed(1).replace('.', ',')} Triệu ₫`;
      if (locale === 'ko') return `${tr.toFixed(1)}백만 ₫`;
      return `${tr.toFixed(1)}M ₫`;
    }

    function loadInitialPrefs() {
      const params = new URLSearchParams(window.location.search);
      const qLang = params.get('lang');
      const qCur = params.get('currency');
      const qProp = params.get('property');
      const qPeriod = params.get('period');
      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {};
      } catch (_) {
        saved = {};
      }
      const lang = ['vi', 'en', 'ko'].includes(qLang) ? qLang : (['vi', 'en', 'ko'].includes(saved.lang) ? saved.lang : 'vi');
      const cur = ['VND', 'KRW', 'USD'].includes(qCur) ? qCur : (['VND', 'KRW', 'USD'].includes(saved.cur) ? saved.cur : 'VND');
      const prop = ['a', 'b'].includes(qProp) ? qProp : (['a', 'b'].includes(saved.prop) ? saved.prop : 'a');
      const period = ['30d', '7d'].includes(qPeriod) ? qPeriod : (['30d', '7d'].includes(saved.period) ? saved.period : '30d');

      document.getElementById('language-select').value = lang;
      document.getElementById('currency-select').value = cur;
      document.getElementById('property-select').value = prop;
      document.getElementById('period-select').value = period;
    }

    function savePrefs(lang, cur, prop, period) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ lang, cur, prop, period }));
      } catch (_) {
        // Ignore storage quota errors
      }
    }

    function syncStaticChrome(locale) {
      const t = UI_COPY[locale];
      document.documentElement.lang = locale;
      document.title = t.docTitle;
      document.getElementById('brand-sub').textContent = t.brandSub;

      const navIds = ['nav-overview', 'nav-calendar', 'nav-payout', 'nav-rooms', 'nav-bidding'];
      navIds.forEach((id, i) => {
        document.getElementById(id).textContent = t.nav[i];
      });

      const propSel = document.getElementById('property-select');
      propSel.setAttribute('aria-label', t.ariaProperty);
      document.getElementById('prop-opt-a').textContent = t.propOptions.a;
      document.getElementById('prop-opt-b').textContent = t.propOptions.b;

      const periodSel = document.getElementById('period-select');
      periodSel.setAttribute('aria-label', t.ariaPeriod);
      document.getElementById('period-opt-30d').textContent = t.periodOptions['30d'];
      document.getElementById('period-opt-7d').textContent = t.periodOptions['7d'];

      document.getElementById('language-select').setAttribute('aria-label', t.ariaLanguage);

      const curSel = document.getElementById('currency-select');
      curSel.setAttribute('aria-label', t.ariaCurrency);
      document.getElementById('cur-opt-vnd').textContent = t.currencyOptions.VND;
      document.getElementById('cur-opt-krw').textContent = t.currencyOptions.KRW;
      document.getElementById('cur-opt-usd').textContent = t.currencyOptions.USD;

      document.getElementById('cto-lineage-toggle').textContent = t.lineageBtn;
    }

    function render() {
      const locale = document.getElementById('language-select').value || 'vi';
      const propKey = document.getElementById('property-select').value;
      const period = document.getElementById('period-select').value;
      const cur = document.getElementById('currency-select').value;
      savePrefs(locale, cur, propKey, period);
      syncStaticChrome(locale);
      hideTip();

      const t = UI_COPY[locale];
      const mult = period === '7d' ? 0.26 : 1;
      const d = DATA[propKey];
      const sc = (n) => (n === 0 ? 0 : Math.max(1, Math.round(n * mult)));

      // Subtle 1-line data cutoff timestamp ( >= 24h T-1 delay, zero technical banner )
      const t1Date = fmtFullDateOffset(1, locale);
      document.getElementById('data-cutoff-note').textContent = t.cutoffCaption(t1Date);

      const leftTotal = d.paretoLeft.reduce((s, x) => s + sc(x.count), 0);
      const rightTotal = d.paretoRight.reduce((s, x) => s + sc(x.count), 0);
      const won = d.won === 0 ? 0 : sc(d.won);
      const losses = d.losses.map((l) => {
        const c = l.syncPareto === 'left' ? leftTotal : l.syncPareto === 'right' ? rightTotal : sc(l.count);
        const rawDetail = l.detail[locale];
        return {
          ...l,
          c,
          stageText: l.stage[locale],
          dropText: l.dropName[locale],
          actText: l.act[locale],
          detailText: typeof rawDetail === 'function' ? rawDetail(c) : rawDetail,
        };
      });
      if (activeFunnelIdx >= losses.length) activeFunnelIdx = 0;

      const lostSum = losses.reduce((s, x) => s + x.c, 0);
      const bids = won + lostSum;
      const winPctNum = bids > 0 ? (won / bids) * 100 : 0;
      const lossPctNum = bids > 0 ? (lostSum / bids) * 100 : 0;
      const winPctStr = fmtDec(winPctNum, 1, locale);
      const lossPctStr = fmtDec(lossPctNum, 1, locale);

      // 5 Executive KPI Cards (with explicit Win Rate AND Loss Rate on a single crisp line)
      document.getElementById('kpi-strip').innerHTML = [
        { lbl: t.kpi.revLbl, val: fmtMoney(d.revVnd, cur, mult, locale), sub: t.kpi.revSub(won), clr: '#047857' },
        { lbl: t.kpi.bidsLbl, val: t.kpi.bidsVal(bids), sub: t.kpi.bidsSub(lostSum, lossPctStr), clr: '#0F172A' },
        {
          lbl: t.kpi.winLbl,
          val: `<span style="font-size:23px;white-space:nowrap"><span style="color:#1D4ED8">${winPctStr}%</span> <span style="color:#94A3B8;font-weight:600;font-size:19px">/</span> <span style="color:#B91C1C">${lossPctStr}%</span></span>`,
          sub: t.kpi.winSub,
          clr: '#1D4ED8',
        },
        { lbl: t.kpi.ratingLbl, val: `${fmtDec(d.ratingNum, 1, locale)} / ${fmtDec(5.0, 1, locale)}`, sub: d.ratingSub[locale], clr: '#B45309' },
        { lbl: t.kpi.autoLbl, val: `${fmtDec(d.autoBidPct, 1, locale)}%`, sub: t.kpi.autoSub, clr: '#6D28D9' },
      ].map((k) => `<div class="kpi-card"><div class="kpi-label">${k.lbl}</div><div class="kpi-val" style="color:${k.clr}">${k.val}</div><div class="kpi-sub">${k.sub}</div></div>`).join('');

      // Chart 1: Dual Y-Axis Combo (Left Y = Completed Bookings [Bars], Right Y = Net Revenue [Line])
      const c1Steps = 4;
      const c1XLeft = 56, c1XRight = 862, c1YTop = 36, c1YBot = 196;
      const c1PlotH = c1YBot - c1YTop; // 160px
      const wDays = d.dayWon.map((n) => (n === 0 ? 0 : sc(n)));
      const maxWonDay = Math.max(0, ...wDays);
      const yMaxWon = maxWonDay <= 2 ? 4 : 8; // 0,1,2,3,4 or 0,2,4,6,8 (always exact integers on 4 steps)

      const revRate = cur === 'USD' ? 25400 : cur === 'KRW' ? 18.5 : 1;
      const yMaxRevCur = cur === 'USD'
        ? (period === '7d' ? 200 : 800)
        : cur === 'KRW'
          ? (period === '7d' ? 240000 : 1000000)
          : (period === '7d' ? 4000000 : 16000000);

      const fmtRevTick = (valCur) => {
        if (valCur === 0) return cur === 'KRW' ? '0 ₩' : cur === 'USD' ? '$0' : '0 ₫';
        if (cur === 'USD') return `$${Math.round(valCur)}`;
        if (cur === 'KRW') {
          if (locale === 'ko') return `${Math.round(valCur / 10000)}만 ₩`;
          if (locale === 'en') return valCur >= 1000000 ? `${(valCur / 1000000).toFixed(1).replace(/\.0$/, '')}M ₩` : `${Math.round(valCur / 1000)}K ₩`;
          return valCur >= 1000000 ? `${(valCur / 1000000).toFixed(1).replace('.', ',')}Tr ₩` : `${Math.round(valCur / 1000)}N ₩`;
        }
        const m = valCur / 1000000;
        if (locale === 'vi') return `${m}tr ₫`;
        if (locale === 'ko') return `${m}백만 ₫`;
        return `${m}M ₫`;
      };

      const fmtRevPoint = (valCur) => {
        if (valCur <= 0) return '';
        if (cur === 'USD') return `$${Math.round(valCur)}`;
        if (cur === 'KRW') {
          if (locale === 'ko') return `${(valCur / 10000).toFixed(1).replace(/\.0$/, '')}만`;
          if (locale === 'en') return `${Math.round(valCur / 1000)}K`;
          return `${Math.round(valCur / 1000)}N`;
        }
        const m = valCur / 1000000;
        return locale === 'vi' ? `${m.toFixed(1).replace('.', ',')}tr` : `${m.toFixed(1)}M`;
      };

      const c1GridAndTicks = Array.from({ length: c1Steps + 1 }, (_, k) => {
        const ratio = k / c1Steps;
        const gy = (c1YBot - ratio * c1PlotH).toFixed(1);
        const leftVal = Math.round(ratio * yMaxWon);
        const rightVal = ratio * yMaxRevCur;
        const isBase = k === 0;
        return `
          <line x1="${c1XLeft}" y1="${gy}" x2="${c1XRight}" y2="${gy}" stroke="${isBase ? '#94A3B8' : '#E2E8F0'}" stroke-width="${isBase ? '1.3' : '1'}" ${isBase ? '' : 'stroke-dasharray="4 4"'}/>
          <line x1="${c1XLeft - 5}" y1="${gy}" x2="${c1XLeft}" y2="${gy}" stroke="#1D4ED8" stroke-width="1.3"/>
          <text x="${c1XLeft - 9}" y="${Number(gy) + 4}" text-anchor="end" font-size="11.5" font-weight="700" fill="#1D4ED8">${leftVal}</text>
          <line x1="${c1XRight}" y1="${gy}" x2="${c1XRight + 5}" y2="${gy}" stroke="#059669" stroke-width="1.3"/>
          <text x="${c1XRight + 9}" y="${Number(gy) + 4}" text-anchor="start" font-size="11.5" font-weight="700" fill="#047857">${fmtRevTick(rightVal)}</text>`;
      }).join('');

      const c1Pts = [];
      const revBars = d.isoDays.map((isoDay, i) => {
        const dayLbl = fmtChartDate(isoDay, locale);
        const x = Math.round(108 + i * ((c1XRight - 50 - 108) / 7));
        const wDay = wDays[i];
        const bh = (wDay / yMaxWon) * c1PlotH;
        const yBar = c1YBot - bh;

        const dayVnd = d.dayRev[i] * 1000000 * mult;
        const dayCur = dayVnd / revRate;
        const dotY = c1YBot - (dayCur / yMaxRevCur) * c1PlotH;
        c1Pts.push({ x, y: dotY, valCur: dayCur });

        const dayRevFmt = fmtMoney(d.dayRev[i] * 1000000, cur, mult, locale);
        const barLblY = c1YBot - 5.5;
        return `<g class="rev-pt" data-day="${dayLbl}" data-won="${wDay}" data-rev="${dayRevFmt}" style="cursor:pointer">
                <rect x="${x - 26}" y="${c1YTop - 8}" width="52" height="${c1PlotH + 14}" fill="transparent"/>
                ${wDay > 0 ? `<rect x="${x - 21}" y="${yBar.toFixed(1)}" width="42" height="${bh.toFixed(1)}" rx="5" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>` : ''}
                <text x="${x}" y="${c1YBot + 20}" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">${dayLbl}</text>
                ${wDay > 0 ? `<text class="c1-bar-lbl" x="${x}" y="${barLblY}" text-anchor="middle" font-size="11" fill="#1E40AF" font-weight="800">${t.chart1.barUnit(wDay)}</text>` : ''}
                </g>`;
      }).join('');

      const c1LineNodes = c1Pts.map((p, i) => {
        const bh = (wDays[i] / yMaxWon) * c1PlotH;
        const yBar = c1YBot - bh;
        const revLblY = Math.min(p.y, yBar) - 10;
        const ptTxt = fmtRevPoint(p.valCur);
        return `
          <circle cx="${p.x}" cy="${p.y.toFixed(1)}" r="5" fill="#059669" stroke="#FFFFFF" stroke-width="2" pointer-events="none"/>
          ${ptTxt ? `<text class="c1-rev-lbl" x="${p.x}" y="${revLblY.toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#047857" stroke="#FFFFFF" stroke-width="3" paint-order="stroke" pointer-events="none">${ptTxt}</text>` : ''}`;
      }).join('');

      document.getElementById('chart-revenue-card').innerHTML = `
        <div class="card-head">
          <div>
            <div class="card-title">${t.chart1.title}</div>
            <div class="card-purpose"><strong>${t.purposeLabel}</strong> ${t.chart1.purpose}</div>
            <div class="lineage-chip">${t.sourceEventPrefix} payment_complete</div>
          </div>
          <span class="badge-kpi" style="background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE">${t.chart1.badge}</span>
        </div>
        <svg viewBox="0 0 940 226" width="100%" height="226" id="chart-revenue-svg">
          <text x="${c1XLeft - 18}" y="16" text-anchor="start" font-size="11.5" font-weight="800" fill="#1D4ED8">${t.chart1.yLeftAxis}</text>
          <text x="${c1XRight + 48}" y="16" text-anchor="end" font-size="11.5" font-weight="800" fill="#047857">${t.chart1.yRightAxis}</text>
          <line x1="${c1XLeft}" y1="${c1YTop - 6}" x2="${c1XLeft}" y2="${c1YBot}" stroke="#1D4ED8" stroke-width="1.5"/>
          <line x1="${c1XRight}" y1="${c1YTop - 6}" x2="${c1XRight}" y2="${c1YBot}" stroke="#059669" stroke-width="1.5"/>
          ${c1GridAndTicks}
          ${revBars}
          <polyline points="${c1Pts.map((p) => `${p.x},${p.y.toFixed(1)}`).join(' ')}" fill="none" stroke="#059669" stroke-width="3" pointer-events="none"/>
          ${c1LineNodes}
        </svg>`;

      // Chart 2: Dual Y-Axis Sweet Spot Combo (Left Y = Bids Sent [Bars], Right Y = Win Rate % [Line])
      const c2Steps = 3;
      const c2XLeft = 48, c2XRight = 596, c2YTop = 38, c2YBot = 198;
      const c2PlotH = c2YBot - c2YTop; // 160px
      const bandCounts = d.bands.map((b) => sc(b.bids));
      const maxBandBids = Math.max(1, ...bandCounts);
      const yMaxBids = maxBandBids <= 9 ? 9 : 30; // 0,3,6,9 in 7d; 0,10,20,30 in 30d
      const yMaxRate = 60; // 0%, 20%, 40%, 60%

      const c2GridAndTicks = Array.from({ length: c2Steps + 1 }, (_, k) => {
        const ratio = k / c2Steps;
        const gy = (c2YBot - ratio * c2PlotH).toFixed(1);
        const leftVal = Math.round(ratio * yMaxBids);
        const rightVal = Math.round(ratio * yMaxRate);
        const isBase = k === 0;
        return `
          <line x1="${c2XLeft}" y1="${gy}" x2="${c2XRight}" y2="${gy}" stroke="${isBase ? '#94A3B8' : '#E2E8F0'}" stroke-width="${isBase ? '1.3' : '1'}" ${isBase ? '' : 'stroke-dasharray="4 4"'}/>
          <line x1="${c2XLeft - 5}" y1="${gy}" x2="${c2XLeft}" y2="${gy}" stroke="#475569" stroke-width="1.3"/>
          <text x="${c2XLeft - 8}" y="${Number(gy) + 4}" text-anchor="end" font-size="11.5" font-weight="700" fill="#475569">${leftVal}</text>
          <line x1="${c2XRight}" y1="${gy}" x2="${c2XRight + 5}" y2="${gy}" stroke="#1D4ED8" stroke-width="1.3"/>
          <text x="${c2XRight + 8}" y="${Number(gy) + 4}" text-anchor="start" font-size="11.5" font-weight="700" fill="#1D4ED8">${rightVal}%</text>`;
      }).join('');

      const swPts = [];
      const swBars = d.bands.map((b, i) => {
        const cx = 103 + i * 109;
        const bc = bandCounts[i];
        const bh = (bc / yMaxBids) * c2PlotH;
        const yBar = c2YBot - bh;
        const py = c2YBot - (b.rate / yMaxRate) * c2PlotH;
        swPts.push({ x: cx, y: py, r: b.rate, sweet: b.sweet, yBar, bh });

        const bLbl = b.label[locale];
        const bRate = fmtDec(b.rate, 1, locale);
        // Keep bar count label cleanly separated from line % label in 100% of cases
        const lineNearBottom = py > c2YBot - 30;
        const barTxtY = lineNearBottom
          ? (yBar <= c2YBot - 58 ? yBar + 16 : yBar - 7)
          : (c2YBot - 7);
        return `
          <g class="sw-band" data-lbl="${bLbl}" data-bids="${bc}" data-rate="${bRate}" style="cursor:pointer">
            ${b.sweet ? `<rect x="${cx - 44}" y="${c2YTop - 6}" width="88" height="${c2PlotH + 6}" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6" stroke-dasharray="4 3"/>` : `<rect x="${cx - 44}" y="${c2YTop - 6}" width="88" height="${c2PlotH + 6}" fill="transparent"/>`}
            <rect x="${cx - 22}" y="${yBar.toFixed(1)}" width="44" height="${bh.toFixed(1)}" rx="5" fill="${b.sweet ? '#34D399' : '#CBD5E1'}"/>
            <text class="c2-bar-lbl" x="${cx}" y="${barTxtY.toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="${b.sweet ? '#064E3B' : '#334155'}">${t.chart2.barBids(bc)}</text>
            <text class="c2-x-lbl" x="${cx}" y="${c2YBot + 21}" text-anchor="middle" font-size="11.2" font-weight="${b.sweet ? '800' : '600'}" fill="${b.sweet ? '#047857' : '#475569'}">${bLbl}</text>
          </g>`;
      }).join('');

      document.getElementById('chart-sweetspot-card').innerHTML = `
        <div class="card-head">
          <div>
            <div class="card-title">${t.chart2.title}</div>
            <div class="card-purpose"><strong>${t.purposeLabel}</strong> ${t.chart2.purpose}</div>
            <div class="lineage-chip">${t.sourceEventPrefix} explore_stay_ota_compare_click · offer_listing_sort_change</div>
          </div>
          <span class="badge-kpi" style="background:${d.sweetBadgeBg};color:${d.sweetBadgeColor}">${d.sweetBadge[locale]}</span>
        </div>
        <svg viewBox="0 0 648 232" width="100%" height="232" id="chart-sweetspot-svg">
          <text x="${c2XLeft - 14}" y="16" text-anchor="start" font-size="11.5" font-weight="800" fill="#475569">${t.chart2.yLeftAxis}</text>
          <text x="${c2XRight + 40}" y="16" text-anchor="end" font-size="11.5" font-weight="800" fill="#1D4ED8">${t.chart2.yRightAxis}</text>
          <line x1="${c2XLeft}" y1="${c2YTop - 6}" x2="${c2XLeft}" y2="${c2YBot}" stroke="#64748B" stroke-width="1.5"/>
          <line x1="${c2XRight}" y1="${c2YTop - 6}" x2="${c2XRight}" y2="${c2YBot}" stroke="#1D4ED8" stroke-width="1.5"/>
          ${c2GridAndTicks}
          ${swBars}
          <polyline points="${swPts.map((p) => `${p.x},${p.y.toFixed(1)}`).join(' ')}" fill="none" stroke="#1D4ED8" stroke-width="3.2" pointer-events="none"/>
          ${swPts.map((p) => `<circle cx="${p.x}" cy="${p.y.toFixed(1)}" r="5.5" fill="${p.sweet ? '#059669' : '#1D4ED8'}" stroke="#FFFFFF" stroke-width="2" pointer-events="none"/>
            <text class="c2-rate-lbl" x="${p.x}" y="${(p.y - 10).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="${p.sweet ? '#047857' : '#1E40AF'}" stroke="#FFFFFF" stroke-width="3.2" paint-order="stroke" pointer-events="none">${fmtDec(p.r, 1, locale)}%</text>`).join('')}
        </svg>`;

      // Chart 3: 4 Submitted Request Contexts (Post-"Find Bid" only: booking_form_complete)
      document.getElementById('chart-context-card').innerHTML = `
        <div class="card-head">
          <div>
            <div class="card-title">${t.chart3.title}</div>
            <div class="card-purpose"><strong>${t.purposeLabel}</strong> ${t.chart3.purpose}</div>
            <div class="lineage-chip">${t.sourceEventPrefix} booking_form_complete · offer_card_impression</div>
          </div>
        </div>
        <div class="hbar-list">
          ${d.contexts.map((c) => `
            <div class="hbar-item">
              <div class="hbar-top"><span>${c.name[locale]}</span><span style="color:#047857">${c.lift[locale]}</span></div>
              <div class="hbar-pair">
                <div class="hbar-row"><span>${c.onLbl[locale]}</span><div class="hbar-track"><div class="hbar-fill" style="width:${Math.min(100, c.onVal * 2.2)}%;background:#2563EB"></div></div><strong style="color:#1D4ED8;text-align:right">${fmtDec(c.onVal, 1, locale)}%</strong></div>
                <div class="hbar-row"><span>${c.offLbl[locale]}</span><div class="hbar-track"><div class="hbar-fill" style="width:${Math.min(100, c.offVal * 2.2)}%;background:#CBD5E1"></div></div><span style="text-align:right">${fmtDec(c.offVal, 1, locale)}%</span></div>
              </div>
            </div>`).join('')}
        </div>`;

      // Chart 4: 4-STAGE HOTEL-CONTROLLABLE FUNNEL + DUAL LOSS RATES (Step Loss % & Overall Loss %)!
      let rem = bids;
      const stages = [];
      losses.forEach((l, idx) => {
        const startCount = rem;
        const nextCount = rem - l.c;
        const stepLossNum = startCount > 0 ? (l.c / startCount) * 100 : 0;
        const totLossNum = bids > 0 ? (l.c / bids) * 100 : 0;
        const shareOfLostNum = lostSum > 0 ? (l.c / lostSum) * 100 : 0;
        stages.push({
          ...l, idx, startCount, nextCount,
          pctOfTotal: fmtDec((startCount / bids) * 100, 1, locale),
          stepLossPct: fmtDec(stepLossNum, 1, locale),
          totLossPct: fmtDec(totLossNum, 1, locale),
          shareOfLostPct: fmtDec(shareOfLostNum, 1, locale),
        });
        rem = nextCount;
      });

      const cx = 198;
      const minW = 112, maxW = 372;
      const wFor = (val) => minW + ((val / bids) * (maxW - minW));
      const rowH = 54, gapY = 7, calloutX = 398, calloutW = 196;

      const funnelPolys = stages.map((st, i) => {
        const y1 = 10 + i * (rowH + gapY);
        const y2 = y1 + rowH;
        const w1 = wFor(st.startCount);
        const w2 = wFor(st.nextCount);
        const pStr = `${(cx - w1/2).toFixed(1)},${y1} ${(cx + w1/2).toFixed(1)},${y1} ${(cx + w2/2).toFixed(1)},${y2} ${(cx - w2/2).toFixed(1)},${y2}`;
        const slopeMidX = cx + (w1 + w2) / 4;
        return `
          <g class="funnel-slice" data-fidx="${i}" style="cursor:pointer">
            <rect x="8" y="${y1}" width="590" height="${rowH}" rx="8" fill="transparent"/>
            <polygon class="funnel-stage-poly ${i === activeFunnelIdx ? 'is-active' : ''}" points="${pStr}" fill="${st.polyClr}" stroke="${i === activeFunnelIdx ? '#0F172A' : '#FFFFFF'}" stroke-width="${i === activeFunnelIdx ? '2.5' : '1.5'}"/>
            <text x="${cx}" y="${y1 + 22}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF" pointer-events="none">${st.stageText}</text>
            <text x="${cx}" y="${y1 + 41}" text-anchor="middle" font-size="13" font-weight="800" fill="#E0F2FE" pointer-events="none">${t.chart4.stageCount(st.startCount, st.pctOfTotal)}</text>
            <line x1="${slopeMidX.toFixed(1)}" y1="${y1 + rowH/2}" x2="${calloutX - 4}" y2="${y1 + rowH/2}" stroke="${st.color}" stroke-width="1.5" stroke-dasharray="4 3" pointer-events="none"/>
            <circle cx="${slopeMidX.toFixed(1)}" cy="${y1 + rowH/2}" r="3.2" fill="${st.color}" pointer-events="none"/>
            <rect class="callout-box" x="${calloutX}" y="${y1 + 6}" width="${calloutW}" height="42" rx="7" fill="#FEF2F2" stroke="${st.color}" stroke-width="1.3"/>
            <text class="callout-top-txt" x="${calloutX + calloutW/2}" y="${y1 + 23}" text-anchor="middle" font-size="11.5" font-weight="800" fill="${st.color}" pointer-events="none">${t.chart4.dropCalloutTop(st.c, st.stepLossPct)}</text>
            <text class="callout-sub-txt" x="${calloutX + calloutW/2}" y="${y1 + 39}" text-anchor="middle" font-size="11" font-weight="600" fill="#475569" pointer-events="none">${t.chart4.dropCalloutSub(st.totLossPct)}</text>
          </g>`;
      }).join('');

      const yWin = 10 + 4 * (rowH + gapY);
      const wWinTop = wFor(won);
      const wWinBot = Math.max(102, wWinTop - 16);
      const winPolyStr = `${(cx - wWinTop/2).toFixed(1)},${yWin} ${(cx + wWinTop/2).toFixed(1)},${yWin} ${(cx + wWinBot/2).toFixed(1)},${yWin + 48} ${(cx - wWinBot/2).toFixed(1)},${yWin + 48}`;
      const winBlock = `
        <g id="funnel-win-stage" style="cursor:pointer">
          <polygon points="${winPolyStr}" fill="#059669" stroke="#064E3B" stroke-width="1.5"/>
          <text x="${cx}" y="${yWin + 21}" text-anchor="middle" font-size="12" font-weight="700" fill="#ECFDF5" pointer-events="none">${t.chart4.winStageTitle}</text>
          <text x="${cx}" y="${yWin + 39}" text-anchor="middle" font-size="13" font-weight="900" fill="#FFFFFF" pointer-events="none">${t.chart4.winStageCount(won, winPctStr)}</text>
        </g>`;

      const selStage = stages[activeFunnelIdx] || stages[0];
      document.getElementById('loss-diagnosis-section').innerHTML = `
        <div class="card-head">
          <div>
            <div class="card-title">${t.chart4.title}</div>
            <div class="card-purpose"><strong>${t.purposeLabel}</strong> ${t.chart4.purpose}</div>
            <div class="lineage-chip">${t.sourceEventPrefix} offer_listing_sort_change · offer_ttl_expired · offer_reject_confirm · explore_stay_ota_compare_click · explore_stay_media_click</div>
          </div>
          <div class="badge-group">
            <span class="badge-kpi" style="background:#FEF2F2;color:#B91C1C;border-color:#FECACA">${t.chart4.lossBadge(lossPctStr, lostSum, bids)}</span>
            <span class="badge-kpi" style="background:#ECFDF5;color:#047857;border-color:#A7F3D0">${t.chart4.winBadge(winPctStr, won, bids)}</span>
          </div>
        </div>
        <div class="funnel-layout">
          <svg viewBox="0 0 602 310" width="100%" height="310" id="funnel-svg">
            ${funnelPolys}
            ${winBlock}
          </svg>
          <div>
            <table class="excel-table">
              <thead>
                <tr>
                  <th>${t.chart4.colStage}</th>
                  <th style="text-align:right;width:74px">${t.chart4.colCount}</th>
                  <th style="text-align:right;width:90px">${t.chart4.colStepLoss}</th>
                  <th style="text-align:right;width:96px">${t.chart4.colTotalLoss}</th>
                  <th style="width:186px">${t.chart4.colAction}</th>
                </tr>
              </thead>
              <tbody>
                ${stages.map((st, i) => `
                  <tr class="f-row ${i === activeFunnelIdx ? 'is-active' : ''}" data-fidx="${i}">
                    <td><strong style="color:${st.color}">${t.chart4.stepPrefix(i + 1)}</strong> ${st.dropText}</td>
                    <td style="text-align:right;font-weight:800;color:${st.color}">−${st.c}</td>
                    <td style="text-align:right;font-weight:800;color:#B91C1C">${st.stepLossPct}%</td>
                    <td style="text-align:right;font-weight:700;color:#334155">${st.totLossPct}%</td>
                    <td style="font-weight:600;color:#334155">${st.actText}</td>
                  </tr>`).join('')}
              </tbody>
              <tfoot>
                <tr style="background:#FEF2F2;font-weight:800;color:#0F172A">
                  <td>${t.chart4.footTotal}</td>
                  <td style="text-align:right;color:#B91C1C">−${lostSum}</td>
                  <td style="text-align:right;color:#64748B;font-weight:700">${t.chart4.footStepDash}</td>
                  <td style="text-align:right;color:#B91C1C">${lossPctStr}%</td>
                  <td style="color:#047857;font-weight:800">${t.chart4.footWon(won, winPctStr)}</td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
        <div class="funnel-detail-bar" id="funnel-detail-bar">
          <div><strong>${t.chart4.viewingPrefix(selStage.stageText)}</strong> ${selStage.detailText}</div>
          <span class="badge-kpi" style="background:#FFFFFF;border-color:#CBD5E1;color:${selStage.color}">${t.chart4.actionPrefix(selStage.actText)}</span>
        </div>`;

      // Bind interactive Funnel hover & click events
      const updateActiveFunnel = (idx) => {
        activeFunnelIdx = idx;
        document.querySelectorAll('.funnel-stage-poly').forEach((el, k) => {
          el.classList.toggle('is-active', k === idx);
          el.setAttribute('stroke', k === idx ? '#0F172A' : '#FFFFFF');
          el.setAttribute('stroke-width', k === idx ? '2.5' : '1.5');
        });
        document.querySelectorAll('.excel-table tr.f-row').forEach((row, k) => row.classList.toggle('is-active', k === idx));
        const st = stages[idx];
        document.getElementById('funnel-detail-bar').innerHTML = `
          <div><strong>${t.chart4.viewingPrefix(st.stageText)}</strong> ${st.detailText}</div>
          <span class="badge-kpi" style="background:#FFFFFF;border-color:#CBD5E1;color:${st.color}">${t.chart4.actionPrefix(st.actText)}</span>`;
      };

      document.querySelectorAll('[data-fidx]').forEach((el) => {
        const idx = Number(el.getAttribute('data-fidx'));
        const st = stages[idx];
        el.addEventListener('mouseenter', (e) => {
          updateActiveFunnel(idx);
          showTip(e, `<div style="font-weight:800;font-size:14.5px;margin-bottom:4px;color:#93C5FD">${t.chart4.tipHeader(st.stageText, st.startCount, st.nextCount)}</div>
                      <div>${t.chart4.tipStepLoss(st.c, st.stepLossPct)}</div>
                      <div>${t.chart4.tipTotLoss(st.totLossPct, st.shareOfLostPct)}</div>
                      <div style="margin-top:5px;color:#E2E8F0">${st.detailText}</div>`);
        });
        el.addEventListener('mousemove', (e) => showTip(e, tip.innerHTML));
        el.addEventListener('mouseleave', hideTip);
        el.addEventListener('click', () => updateActiveFunnel(idx));
      });

      const winEl = document.getElementById('funnel-win-stage');
      if (winEl) {
        winEl.addEventListener('mouseenter', (e) => showTip(e, `<div style="font-weight:800;font-size:14.5px;margin-bottom:4px;color:#6EE7B7">${t.chart4.winTipTitle(won, winPctStr, lossPctStr)}</div><div>${t.chart4.winTipBody}</div>`));
        winEl.addEventListener('mousemove', (e) => showTip(e, tip.innerHTML));
        winEl.addEventListener('mouseleave', hideTip);
      }

      document.querySelectorAll('.sw-band').forEach((el) => {
        el.addEventListener('mouseenter', (e) => showTip(e, `<strong>${el.dataset.lbl}</strong><br/>${t.chart2.tipBids(el.dataset.bids)}<br/>${t.chart2.tipRate(el.dataset.rate)}`));
        el.addEventListener('mousemove', (e) => showTip(e, tip.innerHTML));
        el.addEventListener('mouseleave', hideTip);
      });
      document.querySelectorAll('.rev-pt').forEach((el) => {
        el.addEventListener('mouseenter', (e) => showTip(e, `<strong>${t.chart1.tipDate(el.dataset.day)}</strong><br/>${t.chart1.tipWon(el.dataset.won)}<br/>${t.chart1.tipRev(el.dataset.rev)}`));
        el.addEventListener('mousemove', (e) => showTip(e, tip.innerHTML));
        el.addEventListener('mouseleave', hideTip);
      });

      // Chart 5: Ranked Specific Causes
      const renderPareto = (items) => items.map((it) => `
        <div class="p-row">
          <div class="p-head"><span>${it.label[locale]}</span><span style="color:${it.color};white-space:nowrap">${t.chart5.rowStat(sc(it.count), fmtDec(it.pct, 1, locale))}</span></div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${it.pct}%;background:${it.color}"></div></div>
        </div>`).join('');
      document.getElementById('chart-pareto-card').innerHTML = `
        <div class="card-head">
          <div>
            <div class="card-title">${t.chart5.title}</div>
            <div class="card-purpose"><strong>${t.purposeLabel}</strong> ${t.chart5.purpose}</div>
            <div class="lineage-chip">${t.sourceEventPrefix} offer_reject_confirm · explore_stay_modal_view · explore_stay_media_click · explore_stay_map_interact</div>
          </div>
        </div>
        <div class="grid-2-eq">
          <div class="pareto-col"><div class="pareto-sub">${d.paretoLeftTitle[locale](leftTotal)}</div>${renderPareto(d.paretoLeft)}</div>
          <div class="pareto-col"><div class="pareto-sub">${d.paretoRightTitle[locale](rightTotal)}</div>${renderPareto(d.paretoRight)}</div>
        </div>`;

      // AI Business Action Summary (Calm, Neutral Executive Design)
      document.getElementById('ai-advisor-section').innerHTML = `
        <div class="card-head">
          <div>
            <div class="card-title">${t.ai.title}</div>
            <div class="card-purpose"><strong>${t.purposeLabel}</strong> ${t.ai.purpose}</div>
          </div>
          <span class="badge-kpi" style="background:#F8FAFC;color:#334155;border-color:#CBD5E1">${t.ai.badge}</span>
        </div>
        <div class="ai-grid">
          ${d.aiCards.map((c, idx) => `
            <div class="ai-card" id="ai-card-${idx}">
              <div class="ai-top">
                <span class="ai-tier">${c.tier[locale]}</span>
                <span class="ai-score">${fmtDec(c.score, 1, locale)}%</span>
              </div>
              <div class="ai-bar-track"><div class="ai-bar-fill" style="width:${c.score}%"></div></div>
              <div class="ai-action">${c.action[locale]}</div>
              <div class="ai-note">${typeof c.note[locale] === 'function' ? c.note[locale](leftTotal, rightTotal) : c.note[locale]}</div>
              <div class="lineage-chip">${t.eventChipPrefix} ${c.src}</div>
            </div>`).join('')}
        </div>`;
    }

    ['property-select', 'period-select', 'language-select', 'currency-select'].forEach((id) =>
      document.getElementById(id).addEventListener('change', render)
    );
    document.getElementById('cto-lineage-toggle').addEventListener('click', (e) => {
      document.body.classList.toggle('show-lineage');
      e.currentTarget.classList.toggle('active');
    });

    loadInitialPrefs();
    render();
  </script>
</body>
</html>
